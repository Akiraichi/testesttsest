name: p27 mixed tensor v2 audit

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
      - name: Compile mixed-tensor invariant-theory modules
        run: lake env lean AffineGaussianInvariant/InvariantTheoryFullV2.lean
      - name: Reject proof holes and custom axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)|^[[:space:]]*axiom[[:space:]]' AffineGaussianInvariant/InvariantTheory --include='*.lean'; then
            exit 1
          fi
