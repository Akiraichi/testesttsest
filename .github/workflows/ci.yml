name: Lean kernel check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          use-mathlib-cache: true
      - name: Reject proof holes and custom axioms
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)|^[[:space:]]*axiom[[:space:]]' AffineGaussianInvariant --include='*.lean'; then
            echo 'Forbidden proof hole or custom axiom found.'
            exit 1
          fi
      - name: Print transitive axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean AffineGaussianInvariant/Audit/ConditionalTheorems.lean 2>&1 | tee axiom-report.txt
          if grep -E 'sorryAx|Lean\.trustCompiler' axiom-report.txt; then
            echo 'Forbidden transitive axiom dependency found.'
            exit 1
          fi
      - name: Record pinned environment
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee lean-version.txt
          lake --version | tee lake-version.txt
          git rev-parse HEAD | tee source-commit.txt
          test -f lake-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: p27-conditional-as6-audit
          path: |
            axiom-report.txt
            lean-version.txt
            lake-version.txt
            source-commit.txt
            lake-manifest.json
